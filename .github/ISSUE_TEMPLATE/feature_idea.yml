name: Feature or idea
description: Suggest a new mode, question, setting or improvement.
title: "[Idea]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Zodle to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: Optional. What would it make better or more fun?
  - type: dropdown
    id: mode
    attributes:
      label: Related mode
      options:
        - Daily
        - Classic
        - Timed
        - A new mode
        - Not mode-specific
