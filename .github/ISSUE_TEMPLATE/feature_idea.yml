name: Feature or idea
description: Propose a worked-out new mode, question, setting or improvement.
title: "[Idea]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Still a rough idea? Start it in [Ideas](https://github.com/ldaIas/sign-game/discussions/categories/ideas) and open this form once it has taken shape.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Zodle to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: Optional. What would it make better or more fun?
  - type: dropdown
    id: mode
    attributes:
      label: Related mode
      options:
        - Daily
        - Classic
        - Timed
        - A new mode
        - Not mode-specific
  - type: input
    id: discussion
    attributes:
      label: Related discussion
      description: Optional. Link to the Ideas discussion this came from, if there is one.
      placeholder: https://github.com/ldaIas/sign-game/discussions/...
