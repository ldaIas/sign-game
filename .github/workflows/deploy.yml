name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push cancels an older in-flight one.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      # wrangler deploy runs `npm run build` first (the "build" section of wrangler.jsonc).
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned so deploys and PR previews build with the same Wrangler.
          wranglerVersion: "4.164.0"
          command: deploy
