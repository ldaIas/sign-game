<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zodle — Daily Zodiac Sign Quiz</title>
  <meta name="description" content="Guess the zodiac sign from a birthday. A new puzzle every day, plus classic and timed modes.">
  <meta name="theme-color" content="#0b0d1a">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Zodle">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Zodle</h1>
      <nav id="modes">
        <button data-mode="daily" class="active">Daily</button>
        <button data-mode="classic">Classic</button>
        <button data-mode="timed">Timed · 60s</button>
      </nav>
    </header>

    <section id="stats">
      <div data-only="classic timed"><span class="label">Score</span><span id="score">0</span></div>
      <div data-only="classic"><span class="label">Streak</span><span id="streak">0</span></div>
      <div data-only="timed" hidden><span class="label">Time</span><span id="time">60</span></div>
      <div data-only="timed" hidden><span class="label">Best</span><span id="best">0</span></div>
      <div data-only="daily" hidden><span class="label">Misses left</span><span id="misses">5</span></div>
      <div data-only="daily" hidden><span class="label">Day streak</span><span id="day-streak">0</span></div>
    </section>
    <div id="timebar" data-only="timed" hidden><div id="timebar-fill"></div></div>

    <section id="card">
      <p id="daily-tag" class="label" data-only="daily" hidden></p>
      <p class="label">Born on</p>
      <p id="birthday"></p>
      <div id="reveal" hidden>
        <div id="reveal-glyph"></div>
        <div id="reveal-name"></div>
        <div id="reveal-range"></div>
      </div>
    </section>

    <ol id="board" data-only="daily" hidden></ol>

    <p id="prompt"></p>

    <section id="signs" class="grid"></section>
    <section id="elements" class="grid" hidden></section>
    <section id="choices" class="grid" data-only="daily" hidden></section>
    <p id="countdown" data-only="daily" hidden></p>
    <div id="tally" data-only="daily" aria-label="Your guesses" hidden></div>

    <button id="next" hidden>Next birthday →</button>
    <button id="start" hidden>Start 60 seconds</button>

    <aside id="install" hidden>
      <span id="install-text"></span>
      <button id="install-btn" hidden>Install</button>
      <button id="install-close" aria-label="Dismiss">×</button>
    </aside>
  </main>

  <script src="signs.js"></script>
  <script src="sky.js"></script>
  <script src="daily.js"></script>
  <script src="game.js"></script>
  <script src="install.js"></script>
</body>
</html>
