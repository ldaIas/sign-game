<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Game</title>
  <meta name="description" content="A quick browser quiz: name the sun sign for a birthday.">
  <meta name="theme-color" content="#0b0d1a">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Sign Game</h1>
      <nav id="modes">
        <button data-mode="classic" class="active">Classic</button>
        <button data-mode="timed">Timed · 60s</button>
      </nav>
    </header>

    <section id="stats">
      <div><span class="label">Score</span><span id="score">0</span></div>
      <div data-only="classic"><span class="label">Streak</span><span id="streak">0</span></div>
      <div data-only="timed" hidden><span class="label">Time</span><span id="time">60</span></div>
      <div data-only="timed" hidden><span class="label">Best</span><span id="best">0</span></div>
    </section>
    <div id="timebar" data-only="timed" hidden><div id="timebar-fill"></div></div>

    <section id="card">
      <p class="label">Born on</p>
      <p id="birthday"></p>
      <div id="reveal" hidden>
        <div id="reveal-glyph"></div>
        <div id="reveal-name"></div>
        <div id="reveal-range"></div>
      </div>
    </section>

    <p id="prompt"></p>

    <section id="signs" class="grid"></section>
    <section id="elements" class="grid" hidden></section>

    <button id="next" hidden>Next birthday →</button>
    <button id="start" hidden>Start 60 seconds</button>
  </main>

  <script src="signs.js"></script>
  <script src="game.js"></script>
</body>
</html>
